[project]
name = "otd-palace"
version = "0.1.0"
description = "OTD Palace: a market advisor website for players of the Real sports card app"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "waitress==3.0.2",
    "hashids==1.3.1",
    "pywebpush==2.5.0",
    "pillow==12.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "playwright",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
